<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D&D Player View</title>
    <style>
      @font-face {
        font-family: "Cinzel";
        font-weight: 400 700;
        font-display: swap;
        src: url("/fonts/cinzel-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-weight: 300 700;
        font-display: swap;
        src: url("/fonts/inter-latin.woff2") format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Inter", sans-serif;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: "Cinzel", serif;
      }
      #player-root {
        min-height: 100vh;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="player-root"></div>

    <script type="module">
      import React from "https://esm.sh/react@18.2.0";
      import ReactDOM from "https://esm.sh/react-dom@18.2.0/client";

      const { useState, useEffect } = React;

      // Theme CSS Styles (inline styles für zuverlässige Darstellung)
      const themeStyles = {
        dark: {
          bg: "linear-gradient(to bottom right, rgb(17 24 39), rgb(88 28 135), rgb(17 24 39))",
          text: "rgb(243 244 246)",
          accent: "rgb(192 132 252)",
          cardBg: "rgba(31, 41, 55, 0.5)",
          border: "rgba(168, 85, 247, 0.3)",
        },
        fire: {
          bg: "linear-gradient(to bottom right, rgb(69 10 10), rgb(124 45 18), rgb(0 0 0))",
          text: "rgb(243 244 246)",
          accent: "rgb(251 146 60)",
          cardBg: "rgba(127, 29, 29, 0.3)",
          border: "rgba(249, 115, 22, 0.4)",
        },
        forest: {
          bg: "linear-gradient(to bottom right, rgb(5 46 22), rgb(6 78 59), rgb(17 24 39))",
          text: "rgb(243 244 246)",
          accent: "rgb(52 211 153)",
          cardBg: "rgba(20, 83, 45, 0.3)",
          border: "rgba(16, 185, 129, 0.4)",
        },
        ice: {
          bg: "linear-gradient(to bottom right, rgb(8 51 68), rgb(30 58 138), rgb(17 24 39))",
          text: "rgb(243 244 246)",
          accent: "rgb(34 211 238)",
          cardBg: "rgba(30, 58, 138, 0.3)",
          border: "rgba(6, 182, 212, 0.4)",
        },
        cathedral: {
          bg: "linear-gradient(to bottom right, rgb(69 26 3), rgb(113 63 18), rgb(28 25 23))",
          text: "rgb(254 252 232)",
          accent: "rgb(252 211 77)",
          cardBg: "rgba(120, 53, 15, 0.4)",
          border: "rgba(251, 191, 36, 0.6)",
        },
        abyss: {
          bg: "linear-gradient(to bottom right, rgb(15 23 42), rgb(59 7 100), rgb(0 0 0))",
          text: "rgb(241 245 249)",
          accent: "rgb(94 234 212)",
          cardBg: "rgba(15, 23, 42, 0.6)",
          border: "rgba(45, 212, 191, 0.5)",
        },
        bloodmoon: {
          bg: "linear-gradient(to bottom right, rgb(76 5 25), rgb(69 10 10), rgb(0 0 0))",
          text: "rgb(255 241 242)",
          accent: "rgb(253 164 175)",
          cardBg: "rgba(69, 10, 10, 0.5)",
          border: "rgba(244, 63, 94, 0.6)",
        },
        arcane: {
          bg: "linear-gradient(to bottom right, rgb(59 7 100), rgb(112 26 117), rgb(49 46 129))",
          text: "rgb(250 245 255)",
          accent: "rgb(240 171 252)",
          cardBg: "rgba(88, 28, 135, 0.4)",
          border: "rgba(232, 121, 249, 0.6)",
        },
        desert: {
          bg: "linear-gradient(to bottom right, rgb(67 20 7), rgb(120 53 15), rgb(66 32 6))",
          text: "rgb(255 247 237)",
          accent: "rgb(252 211 77)",
          cardBg: "rgba(124, 45, 18, 0.4)",
          border: "rgba(251, 146, 60, 0.5)",
        },
        volcanic: {
          bg: "linear-gradient(to bottom right, rgb(234 88 12), rgb(69 10 10), rgb(0 0 0))",
          text: "rgb(255 247 237)",
          accent: "rgb(253 186 116)",
          cardBg: "rgba(69, 10, 10, 0.6)",
          border: "rgba(249, 115, 22, 0.7)",
        },
        celestial: {
          bg: "linear-gradient(to bottom right, rgb(49 46 129), rgb(30 58 138), rgb(15 23 42))",
          text: "rgb(239 246 255)",
          accent: "rgb(147 197 253)",
          cardBg: "rgba(49, 46, 129, 0.4)",
          border: "rgba(96, 165, 250, 0.6)",
        },
        nether: {
          bg: "linear-gradient(to bottom right, rgb(46 16 101), rgb(59 7 100), rgb(0 0 0))",
          text: "rgb(245 243 255)",
          accent: "rgb(190 242 100)",
          cardBg: "rgba(59, 7, 100, 0.4)",
          border: "rgba(163, 230, 53, 0.5)",
        },
      };

      const formatTime = (seconds) => {
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const secs = seconds % 60;
        return `${hours.toString().padStart(2, "0")}:${minutes
          .toString()
          .padStart(2, "0")}:${secs.toString().padStart(2, "0")}`;
      };

      const formatChallengeTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, "0")}:${secs
          .toString()
          .padStart(2, "0")}`;
      };

      // Helper function um zu checken ob Location ein gültiges Bild hat
      const hasValidLocationImage = (location) => {
        if (!location) {
          return false;
        }

        // SubLocation oder Location: IMMER Badge anzeigen, auch ohne Bild
        return true;
      };

      function PlayerView() {
        const [displayData, setDisplayData] = useState(null);
        const [currentTheme, setCurrentTheme] = useState("dark");
        const [sessionTime, setSessionTime] = useState(0);
        const [currentTime, setCurrentTime] = useState(new Date());
        const [challenge, setChallenge] = useState(null);
        const [tooltips, setTooltips] = useState([]);
        const [currentTooltip, setCurrentTooltip] = useState("");
        const [tooltipOpacity, setTooltipOpacity] = useState(1);
        const [waitingTitles, setWaitingTitles] = useState([]);
        const [currentWaitingTitle, setCurrentWaitingTitle] =
          useState("Player View");
        const [waitingSubtitles, setWaitingSubtitles] = useState([]);
        const [currentWaitingSubtitle, setCurrentWaitingSubtitle] =
          useState("");

        const theme = themeStyles[currentTheme] || themeStyles.dark;

        useEffect(() => {
          const broadcast = new BroadcastChannel("dnd-session");

          broadcast.onmessage = (event) => {
            const data = event.data;
            console.log("PlayerView received:", data);

            if (data.type === "theme") {
              console.log("Setting theme to:", data.theme);
              setCurrentTheme(data.theme);
            } else if (data.type === "sessionTime") {
              setSessionTime(data.time);
            } else if (data.type === "challenge") {
              setChallenge(data.data);
            } else if (data.type === "clear") {
              setDisplayData(null);
              setChallenge(null);
            } else {
              setDisplayData(data);
            }
          };

          const timeInterval = setInterval(() => {
            setCurrentTime(new Date());
          }, 1000);

          return () => {
            broadcast.close();
            clearInterval(timeInterval);
          };
        }, []);

        // Load tooltips from file
        useEffect(() => {
          fetch("/Tooltips/Tooltip_List.txt")
            .then((response) => response.text())
            .then((text) => {
              const lines = text
                .split("\n")
                .map((line) => line.trim())
                .filter(
                  (line) =>
                    line &&
                    !line.startsWith("---") &&
                    !line.startsWith("Ernstgemeint") &&
                    !line.startsWith("Witzig"),
                );
              setTooltips(lines);
              if (lines.length > 0) {
                setCurrentTooltip(
                  lines[Math.floor(Math.random() * lines.length)],
                );
              }
            })
            .catch((error) => {
              console.error("Error loading tooltips:", error);
            });
        }, []);

        // Rotate tooltips every 30 seconds
        useEffect(() => {
          if (tooltips.length === 0) return;

          const rotationInterval = setInterval(() => {
            // Fade out
            setTooltipOpacity(0);

            // After fade out, change tooltip and fade in
            setTimeout(() => {
              const randomIndex = Math.floor(Math.random() * tooltips.length);
              setCurrentTooltip(tooltips[randomIndex]);
              setTooltipOpacity(1);
            }, 500);
          }, 30000);

          return () => clearInterval(rotationInterval);
        }, [tooltips]);

        // Load waiting titles from file
        useEffect(() => {
          fetch("/Tooltips/WarteÜberschrift.txt")
            .then((response) => response.text())
            .then((text) => {
              const lines = text
                .split("\n")
                .map((line) => line.trim())
                .filter((line) => line);
              setWaitingTitles(lines);
              if (lines.length > 0) {
                setCurrentWaitingTitle(
                  lines[Math.floor(Math.random() * lines.length)],
                );
              }
            })
            .catch((error) => {
              console.error("Error loading waiting titles:", error);
            });
        }, []);

        // Load waiting subtitles from file
        useEffect(() => {
          fetch("/Tooltips/WarteUntertitel.txt")
            .then((response) => response.text())
            .then((text) => {
              const lines = text
                .split("\n")
                .map((line) => line.trim())
                .filter((line) => line);
              setWaitingSubtitles(lines);
              if (lines.length > 0) {
                setCurrentWaitingSubtitle(
                  lines[Math.floor(Math.random() * lines.length)],
                );
              }
            })
            .catch((error) => {
              console.error("Error loading waiting subtitles:", error);
            });
        }, []);

        // Change waiting title and subtitle when switching to empty display
        useEffect(() => {
          if (!displayData && waitingTitles.length > 0) {
            setCurrentWaitingTitle(
              waitingTitles[Math.floor(Math.random() * waitingTitles.length)],
            );
          }
          if (!displayData && waitingSubtitles.length > 0) {
            setCurrentWaitingSubtitle(
              waitingSubtitles[
                Math.floor(Math.random() * waitingSubtitles.length)
              ],
            );
          }
        }, [displayData, waitingTitles, waitingSubtitles]);

        // Timer und Uhr Component
        const TimerDisplay = () => {
          return React.createElement(
            "div",
            {
              style: {
                position: "fixed",
                bottom: "1rem",
                right: "1rem",
                background: theme.cardBg,
                backdropFilter: "blur(4px)",
                borderRadius: "0.5rem",
                padding: "1.5rem",
                border: `2px solid ${theme.border}`,
                color: theme.text,
                zIndex: 1000,
              },
            },
            React.createElement(
              "div",
              {
                style: {
                  fontSize: "1.5rem",
                  marginBottom: "0.5rem",
                  fontWeight: "bold",
                },
              },
              currentTime.toLocaleTimeString("de-DE"),
            ),
            sessionTime > 0 &&
              React.createElement(
                "div",
                { style: { fontSize: "1.25rem", color: theme.accent } },
                "Session: " + formatTime(sessionTime),
              ),
          );
        };

        // Wenn keine Daten
        if (!displayData) {
          return React.createElement(
            "div",
            {
              style: {
                minHeight: "100vh",
                background: theme.bg,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                padding: "2rem",
              },
            },
            React.createElement(
              "div",
              { style: { textAlign: "center" } },
              React.createElement(
                "div",
                {
                  style: {
                    color: theme.text,
                    fontSize: "4.5rem",
                    fontWeight: "bold",
                    marginBottom: "1rem",
                    fontFamily: "Georgia, serif",
                  },
                },
                currentWaitingTitle,
              ),
              currentWaitingSubtitle &&
                React.createElement(
                  "p",
                  {
                    style: {
                      color: theme.accent,
                      fontSize: "3rem",
                    },
                  },
                  currentWaitingSubtitle,
                ),
              currentTooltip &&
                React.createElement(
                  "p",
                  {
                    style: {
                      position: "fixed",
                      bottom: "1rem",
                      left: "50%",
                      transform: "translateX(-50%)",
                      color: theme.text,
                      fontSize: "2rem",
                      fontStyle: "italic",
                      opacity: tooltipOpacity,
                      transition: "opacity 0.5s ease-in-out",
                      maxWidth: "50rem",
                      textAlign: "center",
                      padding: "0 1rem",
                      zIndex: 999,
                    },
                  },
                  "Hinweis: " + currentTooltip,
                ),
              React.createElement(TimerDisplay),
            ),
          );
        }

        // Challenge Overlay
        if (challenge) {
          return React.createElement(
            "div",
            {
              style: {
                minHeight: "100vh",
                background: theme.bg,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                padding: "2rem",
              },
            },
            React.createElement(
              "div",
              {
                style: {
                  maxWidth: "56rem",
                  width: "100%",
                  textAlign: "center",
                },
              },
              React.createElement(
                "h1",
                {
                  style: {
                    color: theme.text,
                    fontSize: "4rem",
                    fontWeight: "bold",
                    marginBottom: "1.5rem",
                    fontFamily: "Georgia, serif",
                  },
                },
                challenge.title,
              ),
              challenge.description &&
                React.createElement(
                  "p",
                  {
                    style: {
                      color: theme.text,
                      fontSize: "1.5rem",
                      marginBottom: "2rem",
                      opacity: 0.8,
                    },
                  },
                  challenge.description,
                ),
              React.createElement(
                "div",
                {
                  style: {
                    background: theme.cardBg,
                    backdropFilter: "blur(4px)",
                    border: `4px solid ${theme.border}`,
                    borderRadius: "1rem",
                    padding: "3rem",
                    marginBottom: "2rem",
                  },
                },
                React.createElement(
                  "div",
                  {
                    style: {
                      color:
                        challenge.timeLeft <= 10 && challenge.timeLeft > 0
                          ? "rgb(248 113 113)"
                          : theme.accent,
                      fontSize: "8rem",
                      fontWeight: "bold",
                      fontFamily: "monospace",
                    },
                  },
                  formatChallengeTime(challenge.timeLeft),
                ),
                challenge.timeLeft === 0 &&
                  React.createElement(
                    "div",
                    {
                      style: {
                        color: "rgb(248 113 113)",
                        fontSize: "2.25rem",
                        fontWeight: "bold",
                        marginTop: "1rem",
                      },
                    },
                    "⏰ ZEIT ABGELAUFEN! ⏰",
                  ),
              ),
              React.createElement(TimerDisplay),
            ),
          );
        }

        // D Rektor Intro
        if (displayData && displayData.type === "direktor") {
          return React.createElement(
            "div",
            {
              style: {
                minHeight: "100vh",
                background: theme.bg,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                padding: "2rem",
              },
            },
            React.createElement(
              "div",
              { style: { maxWidth: "80rem", width: "100%" } },
              React.createElement(
                "div",
                {
                  style: {
                    background: theme.cardBg,
                    backdropFilter: "blur(4px)",
                    border: `4px solid ${theme.border}`,
                    borderRadius: "1rem",
                    padding: "3rem",
                    textAlign: "center",
                  },
                },
                React.createElement(
                  "h1",
                  {
                    style: {
                      color: theme.text,
                      fontSize: "4rem",
                      fontWeight: "bold",
                      marginBottom: "2rem",
                      fontFamily: "Georgia, serif",
                    },
                  },
                  displayData.data.title,
                ),
                displayData.data.image &&
                  React.createElement("img", {
                    src: displayData.data.image,
                    alt: "D Rektor",
                    style: {
                      width: "12rem",
                      height: "12rem",
                      objectFit: "cover",
                      borderRadius: "9999px",
                      margin: "0 auto 2rem",
                      border: `4px solid ${theme.border}`,
                    },
                  }),
                React.createElement(
                  "div",
                  {
                    style: {
                      color: theme.text,
                      fontSize: "1.5rem",
                      lineHeight: "1.75",
                      whiteSpace: "pre-wrap",
                    },
                  },
                  displayData.data.text,
                ),
              ),
              React.createElement(TimerDisplay),
            ),
          );
        }

        // DESCRIPTION (with parent badge)
        if (displayData && displayData.type === "description") {
          const desc = displayData.data.description;
          const parent = displayData.data.parent;
          const parentType = displayData.data.parentType;

          // Get parent image
          const parentImage =
            parent.images && parent.images.length > 0 ? parent.images[0] : null;

          return React.createElement(
            "div",
            {
              style: {
                minHeight: "100vh",
                background: theme.bg,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                padding: "2rem",
              },
            },
            React.createElement(
              "div",
              {
                style: {
                  maxWidth: "80rem",
                  width: "100%",
                },
              },
              // Parent Name (über dem Badge)
              React.createElement(
                "h2",
                {
                  style: {
                    color: theme.text,
                    fontSize: "2.5rem",
                    fontWeight: "bold",
                    textAlign: "center",
                    marginBottom: "1.5rem",
                    fontFamily: "Georgia, serif",
                  },
                },
                parent.name,
              ),
              // Parent Badge (mit Bild als Kreis)
              parentImage &&
                React.createElement(
                  "div",
                  {
                    style: {
                      textAlign: "center",
                      marginBottom: "2rem",
                    },
                  },
                  React.createElement("img", {
                    src: parentImage,
                    alt: parent.name,
                    style: {
                      width: "12rem",
                      height: "12rem",
                      objectFit: "cover",
                      borderRadius: "9999px",
                      margin: "0 auto",
                      border: `4px solid ${theme.border}`,
                      boxShadow: "0 8px 32px rgba(0,0,0,0.5)",
                    },
                  }),
                ),
              // Description Box
              React.createElement(
                "div",
                {
                  style: {
                    background: theme.cardBg,
                    backdropFilter: "blur(4px)",
                    border: `4px solid ${theme.border}`,
                    borderRadius: "1rem",
                    padding: "2rem 3rem",
                    maxWidth: "100%",
                    boxSizing: "border-box",
                  },
                },
                // Title (optional)
                desc.title &&
                  React.createElement(
                    "h2",
                    {
                      style: {
                        color: theme.text,
                        fontSize: "3rem",
                        fontWeight: "bold",
                        marginBottom: "2rem",
                        fontFamily: "Georgia, serif",
                        textAlign: "center",
                        wordBreak: "break-word",
                      },
                    },
                    desc.title,
                  ),
                // Description Text
                React.createElement(
                  "div",
                  {
                    style: {
                      color: theme.text,
                      fontSize: "2rem",
                      lineHeight: "1.8",
                      whiteSpace: "pre-wrap",
                      wordBreak: "break-word",
                      overflowWrap: "break-word",
                      maxWidth: "100%",
                    },
                  },
                  desc.text,
                ),
              ),
              React.createElement(TimerDisplay),
            ),
          );
        }

        // CITY
        if (displayData && displayData.type === "city") {
          return React.createElement(
            "div",
            {
              style: {
                minHeight: "100vh",
                background: theme.bg,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                padding: "2rem",
              },
            },
            React.createElement(
              "div",
              {
                style: {
                  maxWidth: "80rem",
                  width: "100%",
                  textAlign: "center",
                },
              },
              React.createElement(
                "h1",
                {
                  style: {
                    color: theme.text,
                    fontSize: "4rem",
                    fontWeight: "bold",
                    marginBottom: "2rem",
                    fontFamily: "Georgia, serif",
                  },
                },
                displayData.data.name,
              ),
              displayData.data.image &&
                React.createElement("img", {
                  src: displayData.data.image,
                  alt: displayData.data.name,
                  style: {
                    width: "100%",
                    maxHeight: "24rem",
                    objectFit: "cover",
                    borderRadius: "0.75rem",
                    boxShadow: "0 25px 50px -12px rgba(0, 0, 0, 0.25)",
                    marginBottom: "1.5rem",
                  },
                }),
              React.createElement(TimerDisplay),
            ),
          );
        }

        // Companion
        if (displayData && displayData.type === "companion") {
          return React.createElement(
            "div",
            {
              style: {
                minHeight: "100vh",
                background: theme.bg,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                padding: "2rem",
              },
            },
            React.createElement(
              "div",
              {
                style: {
                  maxWidth: "56rem",
                  width: "100%",
                  textAlign: "center",
                },
              },
              React.createElement(
                "h1",
                {
                  style: {
                    color: theme.text,
                    fontSize: "4rem",
                    fontWeight: "bold",
                    marginBottom: "2rem",
                    fontFamily: "Georgia, serif",
                  },
                },
                displayData.data.name,
              ),
              displayData.data.image &&
                React.createElement("img", {
                  src: displayData.data.image,
                  alt: displayData.data.name,
                  style: {
                    maxWidth: "28rem",
                    margin: "0 auto",
                    borderRadius: "0.75rem",
                    boxShadow: "0 25px 50px -12px rgba(0, 0, 0, 0.25)",
                    marginBottom: "1.5rem",
                  },
                }),
              displayData.data.description &&
                React.createElement(
                  "p",
                  {
                    style: {
                      color: theme.text,
                      fontSize: "1.25rem",
                      marginBottom: "1.5rem",
                      maxWidth: "42rem",
                      margin: "0 auto 1.5rem",
                    },
                  },
                  displayData.data.description,
                ),
              displayData.data.ability &&
                React.createElement(
                  "div",
                  {
                    style: {
                      background: "rgba(88, 28, 135, 0.4)",
                      border: "2px solid rgba(168, 85, 247, 0.6)",
                      borderRadius: "0.75rem",
                      padding: "1.5rem",
                      maxWidth: "42rem",
                      margin: "0 auto",
                    },
                  },
                  React.createElement(
                    "div",
                    {
                      style: {
                        color: theme.accent,
                        fontSize: "1.5rem",
                        fontWeight: "bold",
                        marginBottom: "0.75rem",
                      },
                    },
                    "🎯 Spezialfähigkeit",
                  ),
                  React.createElement(
                    "p",
                    { style: { color: theme.text, fontSize: "1.125rem" } },
                    displayData.data.ability,
                  ),
                ),
              React.createElement(TimerDisplay),
            ),
          );
        }

        // SubLocation (Objekt/Entdeckung)
        if (displayData && displayData.type === "subLocation") {
          return React.createElement(
            "div",
            {
              style: {
                minHeight: "100vh",
                background: theme.bg,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                padding: "2rem",
              },
            },
            React.createElement(
              "div",
              {
                style: {
                  maxWidth: "112rem",
                  width: "100%",
                  textAlign: "center",
                },
              },
              React.createElement(
                "h1",
                {
                  style: {
                    color: theme.text,
                    fontSize: "3rem",
                    fontWeight: "bold",
                    marginBottom: "2rem",
                    fontFamily: "Georgia, serif",
                  },
                },
                displayData.data.name,
              ),
              displayData.data.image &&
                React.createElement("img", {
                  src: displayData.data.image,
                  alt: displayData.data.name,
                  style: {
                    width: "100%",
                    maxWidth: "84rem",
                    margin: "0 auto",
                    borderRadius: "0.75rem",
                    boxShadow: "0 25px 50px -12px rgba(0, 0, 0, 0.25)",
                    marginBottom: "1.5rem",
                    objectFit: "contain",
                  },
                }),
              React.createElement(TimerDisplay),
            ),
          );
        }

        const type = displayData?.type;
        const data = displayData?.data;
        const location = displayData?.location;
        const npc = displayData?.npc;

        // Both Location and NPC - nur Location zeigen wenn Bild vorhanden
        if (type === "both" && location && npc) {
          const showLocation = hasValidLocationImage(location);

          // Wenn keine Location Bilder: Zeige nur NPC (zentriert, volle Breite)
          if (!showLocation) {
            return React.createElement(
              "div",
              {
                style: {
                  minHeight: "100vh",
                  background: theme.bg,
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  padding: "2rem",
                },
              },
              React.createElement(
                "div",
                { style: { maxWidth: "72rem", width: "100%" } },
                React.createElement(
                  "div",
                  { style: { textAlign: "center" } },
                  React.createElement(
                    "h1",
                    {
                      style: {
                        color: theme.text,
                        fontSize: "3rem",
                        fontWeight: "bold",
                        marginBottom: "1rem",
                        fontFamily: "Georgia, serif",
                      },
                    },
                    npc.name,
                  ),
                  React.createElement(
                    "p",
                    {
                      style: {
                        color: theme.accent,
                        fontSize: "1.5rem",
                        marginBottom: "2rem",
                      },
                    },
                    npc.profession,
                  ),
                  npc.images &&
                    npc.images.length > 0 &&
                    npc.images[npc.selectedImageIndex || 0] &&
                    React.createElement("img", {
                      src: npc.images[npc.selectedImageIndex || 0],
                      alt: npc.name,
                      style: {
                        maxWidth: "32rem",
                        margin: "0 auto",
                        borderRadius: "0.75rem",
                        boxShadow: "0 25px 50px -12px rgba(0, 0, 0, 0.25)",
                        maxHeight: "70vh",
                        objectFit: "contain",
                      },
                    }),
                ),
                React.createElement(TimerDisplay),
              ),
            );
          }

          // Beide anzeigen (Location + NPC) - Location klein links, NPC groß rechts
          return React.createElement(
            "div",
            {
              style: {
                minHeight: "100vh",
                background: theme.bg,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                padding: "2rem",
              },
            },
            React.createElement(
              "div",
              {
                style: {
                  maxWidth: "90rem",
                  width: "100%",
                  display: "flex",
                  gap: "2rem",
                  alignItems: "flex-start",
                },
              },
              // Location Badge (links, klein)
              React.createElement(
                "div",
                {
                  style: {
                    flex: "0 0 20rem",
                    background: theme.cardBg,
                    backdropFilter: "blur(4px)",
                    border: `2px solid ${theme.border}`,
                    borderRadius: "0.75rem",
                    padding: "1rem",
                    marginTop: "2rem",
                  },
                },
                React.createElement(
                  "div",
                  {
                    style: {
                      fontSize: "0.75rem",
                      color: theme.accent,
                      marginBottom: "0.5rem",
                      textTransform: "uppercase",
                      letterSpacing: "0.05em",
                    },
                  },
                  location.isSubLocation ? "Ort" : "Location",
                ),
                React.createElement(
                  "h3",
                  {
                    style: {
                      color: theme.text,
                      fontSize: "1.125rem",
                      fontWeight: "bold",
                      marginBottom: "0.75rem",
                      fontFamily: "Georgia, serif",
                    },
                  },
                  location.name,
                ),
                // Bild für SubLocation (image) oder Location (images Array)
                location.isSubLocation
                  ? location.image &&
                      React.createElement("img", {
                        src: location.image,
                        alt: location.name,
                        style: {
                          width: "100%",
                          borderRadius: "0.5rem",
                          objectFit: "cover",
                          maxHeight: "12rem",
                        },
                      })
                  : location.images &&
                      location.images.length > 0 &&
                      location.images[location.selectedImageIndex || 0] &&
                      React.createElement("img", {
                        src: location.images[location.selectedImageIndex || 0],
                        alt: location.name,
                        style: {
                          width: "100%",
                          borderRadius: "0.5rem",
                          objectFit: "cover",
                          maxHeight: "12rem",
                        },
                      }),
              ),
              // NPC Display (rechts, groß)
              React.createElement(
                "div",
                {
                  style: {
                    flex: "1",
                    textAlign: "center",
                    display: "flex",
                    flexDirection: "column",
                    alignItems: "center",
                  },
                },
                React.createElement(
                  "h1",
                  {
                    style: {
                      color: theme.text,
                      fontSize: "3.5rem",
                      fontWeight: "bold",
                      marginBottom: "1rem",
                      fontFamily: "Georgia, serif",
                    },
                  },
                  npc.name,
                ),
                React.createElement(
                  "p",
                  {
                    style: {
                      color: theme.accent,
                      fontSize: "1.75rem",
                      marginBottom: "2rem",
                    },
                  },
                  npc.profession,
                ),
                npc.images &&
                  npc.images.length > 0 &&
                  npc.images[npc.selectedImageIndex || 0] &&
                  React.createElement("img", {
                    src: npc.images[npc.selectedImageIndex || 0],
                    alt: npc.name,
                    style: {
                      maxWidth: "40rem",
                      width: "100%",
                      borderRadius: "0.75rem",
                      boxShadow: "0 25px 50px -12px rgba(0, 0, 0, 0.25)",
                      maxHeight: "70vh",
                      objectFit: "contain",
                    },
                  }),
              ),
              React.createElement(TimerDisplay),
            ),
          );
        }

        // Only NPC
        if (type === "npc") {
          return React.createElement(
            "div",
            {
              style: {
                minHeight: "100vh",
                background: theme.bg,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                padding: "2rem",
              },
            },
            React.createElement(
              "div",
              { style: { maxWidth: "72rem", width: "100%" } },
              React.createElement(
                "div",
                { style: { textAlign: "center" } },
                React.createElement(
                  "h1",
                  {
                    style: {
                      color: theme.text,
                      fontSize: "3rem",
                      fontWeight: "bold",
                      marginBottom: "1rem",
                      fontFamily: "Georgia, serif",
                    },
                  },
                  data.name,
                ),
                React.createElement(
                  "p",
                  {
                    style: {
                      color: theme.accent,
                      fontSize: "1.5rem",
                      marginBottom: "2rem",

                  },
                  data.profession,
                ),
                data.images &&
                  data.images.length > 0 &&
                  data.images[data.selectedImageIndex || 0] &&
                  React.createElement("img", {
                    src: data.images[data.selectedImageIndex || 0],
                    alt: data.name,
                    style: {
                      maxWidth: "32rem",
                      margin: "0 auto",
                      borderRadius: "0.75rem",
                      boxShadow: "0 25px 50px -12px rgba(0, 0, 0, 0.25)",
                      maxHeight: "70vh",
                      objectFit: "contain",
                    },
                  }),
              ),
              React.createElement(TimerDisplay),
            ),
          );
        }

        // Only Location
        if (type === "location") {
          return React.createElement(
            "div",
            {
              style: {
                minHeight: "100vh",
                background: theme.bg,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                padding: "2rem",
              },
            },
            React.createElement(
              "div",
              { style: { maxWidth: "112rem", width: "100%" } },
              React.createElement(
                "div",
                { style: { textAlign: "center" } },
                React.createElement(
                  "h1",
                  {
                    style: {
                      color: theme.text,
                      fontSize: "3rem",
                      fontWeight: "bold",
                      marginBottom: "2rem",
                      fontFamily: "Georgia, serif",
                    },
                  },
                  data.name,
                ),
                data.images &&
                  data.images.length > 0 &&
                  data.images[data.selectedImageIndex || 0] &&
                  React.createElement("img", {
                    src: data.images[data.selectedImageIndex || 0],
                    alt: data.name,
                    style: {
                      width: "100%",
                      maxWidth: "84rem",
                      borderRadius: "0.75rem",
                      boxShadow: "0 25px 50px -12px rgba(0, 0, 0, 0.25)",
                      maxHeight: "70vh",
                      objectFit: "contain",
                    },
                  }),
              ),
              React.createElement(TimerDisplay),
            ),
          );
        }

        // Item
        if (type === "item") {
          return React.createElement(
            "div",
            {
              style: {
                minHeight: "100vh",
                background: theme.bg,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                padding: "2rem",
              },
            },
            React.createElement(
              "div",
              { style: { maxWidth: "72rem", width: "100%" } },
              React.createElement(
                "div",
                { style: { textAlign: "center" } },
                React.createElement(
                  "h1",
                  {
                    style: {
                      color: theme.text,
                      fontSize: "3rem",
                      fontWeight: "bold",
                      marginBottom: "2rem",
                      fontFamily: "Georgia, serif",
                    },
                  },
                  data.name,
                ),
                data.image &&
                  React.createElement("img", {
                    src: data.image,
                    alt: data.name,
                    style: {
                      maxWidth: "28rem",
                      margin: "0 auto",
                      borderRadius: "0.75rem",
                      boxShadow: "0 25px 50px -12px rgba(0, 0, 0, 0.25)",
                      marginBottom: "1.5rem",
                    },
                  }),
                data.description &&
                  React.createElement(
                    "p",
                    {
                      style: {
                        color: theme.text,
                        fontSize: "1.25rem",
                        marginBottom: "1.5rem",
                        maxWidth: "42rem",
                        margin: "0 auto 1.5rem",
                      },
                    },
                    data.description,
                  ),
                React.createElement(
                  "div",
                  {
                    style: {
                      display: "grid",
                      gridTemplateColumns: "1fr",
                      gap: "1rem",
                      maxWidth: "42rem",
                      margin: "0 auto",
                    },
                  },
                  data.positiveStats &&
                    React.createElement(
                      "div",
                      {
                        style: {
                          background: "rgba(20, 83, 45, 0.3)",
                          border: "2px solid rgba(34, 197, 94, 0.5)",
                          borderRadius: "0.5rem",
                          padding: "1rem",
                        },
                      },
                      React.createElement(
                        "div",
                        {
                          style: {
                            color: "rgb(74 222 128)",
                            fontSize: "1.5rem",
                            fontWeight: "bold",
                            marginBottom: "0.5rem",
                          },
                        },
                        "✅ Vorteile",
                      ),
                      React.createElement(
                        "p",
                        { style: { color: theme.text } },
                        data.positiveStats,
                      ),
                    ),
                  data.negativeStats &&
                    React.createElement(
                      "div",
                      {
                        style: {
                          background: "rgba(127, 29, 29, 0.3)",
                          border: "2px solid rgba(239, 68, 68, 0.5)",
                          borderRadius: "0.5rem",
                          padding: "1rem",
                        },
                      },
                      React.createElement(
                        "div",
                        {
                          style: {
                            color: "rgb(248 113 113)",
                            fontSize: "1.5rem",
                            fontWeight: "bold",
                            marginBottom: "0.5rem",
                          },
                        },
                        "❌ Nachteile",
                      ),
                      React.createElement(
                        "p",
                        { style: { color: theme.text } },
                        data.negativeStats,
                      ),
                    ),
                ),
              ),
              React.createElement(TimerDisplay),
            ),
          );
        }

        return null;
      }

      const root = ReactDOM.createRoot(document.getElementById("player-root"));
      root.render(React.createElement(PlayerView));
    </script>
  </body>
