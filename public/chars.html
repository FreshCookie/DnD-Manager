<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D&D Reisemanifest</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

:root{
  --sky:#12151f;
  --sky-2:#1b2030;
  --kraft:#ddceaa;
  --kraft-dark:#c9b78d;
  --ink:#241f16;
  --brass:#b8863b;
  --brass-bright:#e0a94f;
  --teal:#3f7d7a;
  --teal-bright:#5aa6a2;
  --rust:#a8412e;
  --rust-bright:#c85b45;
  --line: rgba(36,31,22,0.25);
}
*{box-sizing:border-box;}
body,#app{margin:0;padding:0;}
#app{
  font-family:'Inter',sans-serif;
  background:
    radial-gradient(ellipse at 20% -10%, #232a40 0%, transparent 60%),
    radial-gradient(ellipse at 90% 110%, #1c2233 0%, transparent 55%),
    var(--sky);
  min-height:100vh;
  color:var(--kraft);
  padding:18px 14px 60px;
}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--brass-bright);
  opacity:0.85;
}
h1,h2,h3{font-family:'Cinzel',serif;margin:0;}

/* ---------- top bar ---------- */
.topbar{
  display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:18px;padding-bottom:12px;
  border-bottom:1px solid rgba(224,169,79,0.25);
}
.topbar h1{font-size:20px;color:var(--brass-bright);letter-spacing:0.02em;}
.topbar .sub{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8891a8;}

/* ---------- character list ---------- */
.roster{display:flex;flex-direction:column;gap:12px;}
.roster-card{
  position:relative;
  background:var(--kraft);
  color:var(--ink);
  border-radius:3px;
  padding:16px 16px 14px;
  display:flex;justify-content:space-between;align-items:center;
  cursor:pointer;
  box-shadow:0 6px 14px rgba(0,0,0,0.35);
  border-left:6px solid var(--brass);
}
.roster-card:active{transform:scale(0.99);}
.roster-card .name{font-family:'Cinzel',serif;font-weight:700;font-size:17px;}
.roster-card .meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5c5237;margin-top:3px;}
.roster-card .del{
  font-family:'IBM Plex Mono',monospace;
  color:var(--rust);border:1px solid var(--rust);
  background:none;border-radius:3px;padding:5px 9px;font-size:11px;
}
.new-btn{
  margin-top:6px;
  font-family:'IBM Plex Mono',monospace;
  letter-spacing:0.08em;
  background:transparent;
  border:1.5px dashed rgba(224,169,79,0.5);
  color:var(--brass-bright);
  padding:14px;border-radius:3px;
  font-size:12.5px;text-transform:uppercase;
}

/* ---------- boarding pass sheet ---------- */
.pass{
  background:var(--kraft);
  color:var(--ink);
  border-radius:4px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,0.45);
  position:relative;
}
.pass-head{
  padding:16px 16px 10px;
  display:flex;justify-content:space-between;align-items:flex-start;
  border-bottom:2px dashed rgba(36,31,22,0.3);
  gap:12px;
}
.photo-box{
  width:76px;height:76px;flex:0 0 auto;
  border:2px solid var(--brass);border-radius:3px;
  background:#c9b78d repeating-linear-gradient(45deg, rgba(36,31,22,0.06) 0 4px, transparent 4px 8px);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;cursor:pointer;
}
.photo-box img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-box .ph-icon{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#5c5237;text-align:center;letter-spacing:0.05em;padding:4px;}
.photo-box .ph-remove{
  position:absolute;top:2px;right:2px;
  width:18px;height:18px;border-radius:50%;
  background:rgba(36,31,22,0.75);color:#f2ead8;border:none;
  font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;
}
.pass-head .name-field input{
  font-family:'Cinzel',serif;font-weight:700;font-size:22px;
  background:none;border:none;color:var(--ink);width:100%;padding:0;
}
.pass-head .anc-field{
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5c5237;
  display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;
}
.pass-head .anc-field input{
  font-family:'IBM Plex Mono',monospace;font-size:11px;
  background:none;border:none;border-bottom:1px dotted #8a7d54;
  color:#5c5237;width:70px;padding:1px 0;
}
.ticket-no{font-family:'IBM Plex Mono',monospace;font-size:10px;text-align:right;color:#8a7d54;line-height:1.5;}

/* stat strip - perforated ticket stubs */
.stub-strip{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:0;
  border-bottom:2px dashed rgba(36,31,22,0.3);
}
.stub{
  padding:12px 4px 10px;
  text-align:center;
  border-right:1px dashed rgba(36,31,22,0.25);
  position:relative;
}
.stub:last-child{border-right:none;}
.stub .lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.1em;color:#5c5237;}
.stub input{
  width:100%;text-align:center;
  font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:26px;
  background:none;border:none;color:var(--ink);
  -moz-appearance:textfield;
}
.stub input::-webkit-outer-spin-button,.stub input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

.vitals-strip{
  display:grid;grid-template-columns:1.3fr 1fr 1fr;
  border-bottom:2px dashed rgba(36,31,22,0.3);
}
.vital{padding:12px 10px;border-right:1px dashed rgba(36,31,22,0.25);}
.vital:last-child{border-right:none;}
.vital .lbl{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.08em;color:#5c5237;text-transform:uppercase;}
.hp-row{display:flex;align-items:center;gap:6px;margin-top:4px;}
.hp-row button{
  width:24px;height:24px;border-radius:50%;border:1px solid var(--teal);
  background:none;color:var(--teal);font-family:'IBM Plex Mono',monospace;font-size:14px;line-height:1;
}
.hp-row .cur{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:19px;color:var(--teal);min-width:26px;text-align:center;}
.hp-row .max{font-family:'IBM Plex Mono',monospace;font-size:13px;color:#5c5237;}
.hp-row .max input{width:32px;background:none;border:none;border-bottom:1px dotted #8a7d54;font-family:'IBM Plex Mono',monospace;color:#5c5237;text-align:center;}
.simple-num input{
  font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:20px;
  background:none;border:none;color:var(--ink);width:50px;margin-top:2px;
}

.wounds-row{padding:10px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:2px dashed rgba(36,31,22,0.3);}
.wounds-row .lbl{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.08em;color:#5c5237;text-transform:uppercase;}
.wound-dot{
  width:16px;height:16px;border-radius:50%;border:2px solid var(--rust);
  background:none;padding:0;
}
.wound-dot.filled{background:var(--rust);}

/* skills */
.section-label{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.15em;
  text-transform:uppercase;color:#5c5237;padding:12px 16px 4px;
}
.skills-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-bottom:2px dashed rgba(36,31,22,0.3);}
.skill-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 16px;border-top:1px dotted rgba(36,31,22,0.2);
}
.skill-row .sname{font-size:12.5px;}
.skill-row .stag{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#8a7d54;margin-left:4px;}
.skill-row .sval-wrap{display:flex;align-items:center;gap:5px;}
.skill-row button{
  width:19px;height:19px;border-radius:3px;border:1px solid var(--brass);
  background:none;color:var(--brass);font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1;
}
.skill-row .sval{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;min-width:16px;text-align:center;}

/* lists: inventory / abilities */
.list-block{padding:6px 16px 14px;border-bottom:2px dashed rgba(36,31,22,0.3);}
.list-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:7px 0;border-top:1px dotted rgba(36,31,22,0.2);font-size:13px;
}
.list-item button{
  background:none;border:none;color:var(--rust);font-size:15px;padding:0 4px;
}
.add-row{display:flex;gap:6px;margin-top:8px;}
.add-row input{
  flex:1;font-family:'Inter',sans-serif;font-size:13px;
  border:1px solid rgba(36,31,22,0.3);border-radius:3px;padding:7px 8px;background:#f2ead8;color:var(--ink);
}
.add-row button{
  font-family:'IBM Plex Mono',monospace;font-size:12px;
  background:var(--brass);color:#fff;border:none;border-radius:3px;padding:0 12px;
}

.notes-block{padding:6px 16px 18px;}
.notes-block textarea{
  width:100%;min-height:110px;font-family:'Inter',sans-serif;font-size:13px;line-height:1.5;
  border:1px solid rgba(36,31,22,0.25);border-radius:3px;padding:10px;background:#f2ead8;color:var(--ink);
  resize:vertical;
}

/* barcode footer */
.barcode{
  height:34px;margin:0 16px 16px;
  background-image:repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 5px);
  opacity:0.75;
}

.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:none;border:none;color:var(--brass-bright);
  font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.05em;
  margin-bottom:14px;padding:0;
}

.saved-tag{
  position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--sky);
  background:var(--brass-bright);padding:5px 12px;border-radius:20px;
  opacity:0;transition:opacity 0.3s;pointer-events:none;
}
.saved-tag.show{opacity:0.95;}

.loading{text-align:center;padding:60px 0;font-family:'IBM Plex Mono',monospace;color:#8891a8;font-size:12px;}

/* gallery strip */
.gallery-strip{
  display:flex;gap:8px;overflow-x:auto;padding:10px 16px;
  border-bottom:2px dashed rgba(36,31,22,0.3);
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.gallery-strip::-webkit-scrollbar{display:none;}
.gallery-thumb{
  position:relative;flex:0 0 auto;
  width:72px;height:72px;border-radius:3px;
  border:2px solid var(--brass);overflow:hidden;cursor:pointer;
}
.gallery-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.gallery-thumb .th-remove{
  position:absolute;top:2px;right:2px;
  width:22px;height:22px;border-radius:50%;
  background:rgba(36,31,22,0.75);color:#f2ead8;border:none;
  font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.gallery-add{
  flex:0 0 auto;width:72px;height:72px;border-radius:3px;
  border:2px dashed rgba(184,134,59,0.5);
  background:none;color:var(--brass-bright);
  font-size:28px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}

/* lightbox */
.lightbox{
  position:fixed;inset:0;background:rgba(0,0,0,0.93);z-index:9999;
  display:none;align-items:center;justify-content:center;
}
.lightbox img{max-width:96vw;max-height:82vh;object-fit:contain;border-radius:4px;display:block;}
.lb-close{
  position:fixed;top:16px;right:16px;
  width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.lb-prev,.lb-next{
  position:fixed;top:50%;transform:translateY(-50%);
  width:48px;height:48px;border-radius:50%;
  background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:24px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.lb-prev{left:8px;}
.lb-next{right:8px;}

/* currency */
.currency-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:8px 8px 14px;border-bottom:2px dashed rgba(36,31,22,0.3);
}
.currency-item{text-align:center;padding:6px 4px;}
.currency-item .cur-lbl{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.08em;color:#5c5237;text-transform:uppercase;display:block;margin-bottom:4px;}
.currency-item input{
  width:100%;text-align:center;
  font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:20px;
  background:none;border:none;border-bottom:1px dotted #8a7d54;color:var(--ink);
  -moz-appearance:textfield;padding:2px 0;
}
.currency-item input::-webkit-outer-spin-button,.currency-item input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

/* editable skill name hint */
.skill-row .sname{font-size:12.5px;cursor:pointer;border-bottom:1px dotted rgba(184,134,59,0.5);}

/* editable list items */
.list-item .item-edit-btn,.list-item .item-del-btn{
  background:none;border:none;font-size:17px;padding:4px 7px;min-width:36px;min-height:36px;
  cursor:pointer;flex-shrink:0;
}
.list-item .item-edit-btn{color:var(--brass);}
.list-item .item-del-btn{color:var(--rust);}
.list-item .item-edit-input{
  flex:1;font-family:'Inter',sans-serif;font-size:13px;
  border:1px solid var(--brass);border-radius:3px;padding:6px 8px;background:#f2ead8;color:var(--ink);
  min-width:0;
}
.list-item .item-save-btn{
  background:var(--brass);border:none;color:#fff;font-family:'IBM Plex Mono',monospace;
  font-size:15px;border-radius:3px;padding:5px 12px;cursor:pointer;flex-shrink:0;
}
</style>
</head>
<body>

<div id="app"><div class="loading">Lade Manifest…</div></div>
<div id="savedTag" class="saved-tag">gespeichert</div>

<script>
const app = document.getElementById('app');
const savedTag = document.getElementById('savedTag');

function flashSaved(){
  savedTag.classList.add('show');
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(()=>savedTag.classList.remove('show'), 900);
}

function uid(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

const defaultSkills = [
  {name:'Arcana', stat:'INT', val:2},
  {name:'Examination', stat:'INT', val:2},
  {name:'Finesse', stat:'DEX', val:0},
  {name:'Influence', stat:'WIL', val:2},
  {name:'Insight', stat:'WIL', val:2},
  {name:'Lore', stat:'INT', val:2},
  {name:'Might', stat:'STR', val:3},
  {name:'Naturecraft', stat:'WIL', val:2},
  {name:'Perception', stat:'WIL', val:2},
  {name:'Stealth', stat:'DEX', val:0},
];

function karlFischer(){
  return {
    id: uid(),
    name:'Karl Fischer',
    ancestry:'Mensch', cls:'Oathsworn', level:1, hitDice:'1d10',
    str:2, dex:0, int:1, wil:1,
    hp:{cur:12, max:12}, tempHp:0,
    armor:8, initiative:1,
    wounds:{cur:0, max:5},
    skills: JSON.parse(JSON.stringify(defaultSkills)),
    inventory:['Schwert & Kolben 1d6+2','Rostige Rüstung','Holzschild','Handschellen'],
    abilities:['Judgement Dice 2d6','Tag on Hands (Ex. Lvl)','Interpose'],
    notes:'Eigentlich Leopold von Cravenmoor. Oath of Vengeance.',
    photos:[],
    currency:{bronze:0,silver:0,gold:0,platinum:0}
  };
}

// ---- storage helpers (REST-API) ----
async function getCharList(){
  try{
    const r = await fetch('/api/chars');
    return r.ok ? await r.json() : [];
  }catch(e){ return []; }
}
async function saveCharList(list){
  try{
    await fetch('/api/chars', {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(list)
    });
  }catch(e){}
}
async function getChar(id){
  try{
    const r = await fetch('/api/chars/'+id);
    return r.ok ? await r.json() : null;
  }catch(e){ return null; }
}
async function saveChar(c){
  try{
    const r = await fetch('/api/chars/'+c.id, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(c)
    });
    if(r.ok) flashSaved();
  }catch(e){ console.error('save failed', e); }
}
async function deleteCharStorage(id){
  try{ await fetch('/api/chars/'+id, {method:'DELETE'}); }catch(e){}
}

// ---- render: roster ----
async function renderRoster(){
  app.innerHTML = '<div class="loading">Lade Manifest…</div>';
  let list = await getCharList();

  if(list.length === 0){
    app.innerHTML = `
      <div class="topbar">
        <div><h1>Reisemanifest</h1><div class="sub">Charakterverwaltung · Nimble</div></div>
      </div>
      <div style="text-align:center;padding:60px 20px;color:var(--brass);">
        <div style="font-size:48px;margin-bottom:16px;">📜</div>
        <div style="font-family:'Cinzel',serif;font-size:20px;margin-bottom:8px;">Noch keine Charaktere</div>
        <div style="font-size:14px;opacity:0.7;">Lege deinen ersten Charakter an!</div>
      </div>
      <button class="new-btn" id="newBtn">+ Neuen Charakter anlegen</button>
    `;
    document.getElementById('newBtn').addEventListener('click', async ()=>{
      const name = prompt('Name des neuen Charakters:');
      if(!name) return;
      const c = {
        id: uid(), name, ancestry:'', cls:'', level:1, hitDice:'1d?',
        str:0, dex:0, int:0, wil:0,
        hp:{cur:10, max:10}, tempHp:0,
        armor:10, initiative:0,
        wounds:{cur:0, max:5},
        skills: JSON.parse(JSON.stringify(defaultSkills)).map(s=>({...s,val:0})),
        inventory:[], abilities:[], notes:'',
        photos:[],
        currency:{bronze:0,silver:0,gold:0,platinum:0}
      };
      await saveChar(c);
      const l = await getCharList();
      l.push(c.id);
      await saveCharList(l);
      renderSheet(c.id);
    });
    return;
  }

  const chars = [];
  for(const id of list){
    const c = await getChar(id);
    if(c) chars.push(c);
  }

  app.innerHTML = `
    <div class="topbar">
      <div><h1>Reisemanifest</h1><div class="sub">Charakterverwaltung · Nimble</div></div>
    </div>
    <div class="roster" id="roster"></div>
    <button class="new-btn" id="newBtn">+ Neuen Charakter anlegen</button>
  `;
  const rosterEl = document.getElementById('roster');
  chars.forEach(c=>{
    const div = document.createElement('div');
    div.className = 'roster-card';
    div.innerHTML = `
      <div style="display:flex;align-items:center;gap:12px;">
        ${((c.photos&&c.photos[0])||c.photo) ? `<img src="${(c.photos&&c.photos[0])||c.photo}" style="width:42px;height:42px;object-fit:cover;border-radius:3px;border:2px solid var(--brass);flex:0 0 auto;">` : ''}
        <div>
          <div class="name">${escapeHtml(c.name||'Unbenannt')}</div>
          <div class="meta">${escapeHtml(c.ancestry||'')} · ${escapeHtml(c.cls||'')} · Lvl ${c.level||1} · HP ${c.hp.cur}/${c.hp.max}</div>
        </div>
      </div>
      <button class="del" data-id="${c.id}">Löschen</button>
    `;
    div.addEventListener('click',(e)=>{
      if(e.target.classList.contains('del')) return;
      renderSheet(c.id);
    });
    div.querySelector('.del').addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(confirm(`"${c.name}" wirklich löschen?`)){
        await deleteCharStorage(c.id);
        const l = await getCharList();
        await saveCharList(l.filter(x=>x!==c.id));
        renderRoster();
      }
    });
    rosterEl.appendChild(div);
  });

  document.getElementById('newBtn').addEventListener('click', async ()=>{
    const name = prompt('Name des neuen Charakters:');
    if(!name) return;
    const c = {
      id: uid(), name, ancestry:'', cls:'', level:1, hitDice:'1d?',
      str:0, dex:0, int:0, wil:0,
      hp:{cur:10, max:10}, tempHp:0,
      armor:10, initiative:0,
      wounds:{cur:0, max:5},
      skills: JSON.parse(JSON.stringify(defaultSkills)).map(s=>({...s,val:0})),
      inventory:[], abilities:[], notes:'',
      photos:[],
      currency:{bronze:0,silver:0,gold:0,platinum:0}
    };
    await saveChar(c);
    const l = await getCharList();
    l.push(c.id);
    await saveCharList(l);
    renderSheet(c.id);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---- render: sheet ----
async function renderSheet(id){
  app.innerHTML = '<div class="loading">Lade Charakter…</div>';
  const c = await getChar(id);
  if(!c){ renderRoster(); return; }

  app.innerHTML = `
    <button class="back-btn" id="backBtn">← Zurück zum Manifest</button>
    <div class="pass">
      <div class="pass-head">
        <div style="flex:1">
          <div class="eyebrow" style="color:#5c5237">Reisender</div>
          <div class="name-field"><input id="f-name" value="${escapeHtml(c.name)}"></div>
          <div class="anc-field">
            <input id="f-anc" value="${escapeHtml(c.ancestry)}" placeholder="Ancestry">
            <input id="f-cls" value="${escapeHtml(c.cls)}" placeholder="Class">
            <span>Lvl</span><input id="f-lvl" type="number" value="${c.level}" style="width:30px">
          </div>
        </div>
        <div class="ticket-no">
          NO. ${c.id.slice(-6).toUpperCase()}<br>
          HIT DICE<br>
          <input id="f-hd" value="${escapeHtml(c.hitDice)}" style="width:50px;text-align:right;background:none;border:none;font-family:'IBM Plex Mono',monospace;color:#5c5237;font-size:10px">
        </div>
      </div>

      <input type="file" id="photoInput" accept="image/*" multiple style="display:none">
      <div id="galleryStrip" class="gallery-strip"></div>

      <div class="stub-strip">
        <div class="stub"><div class="lbl">STR</div><input id="f-str" type="number" value="${c.str}"></div>
        <div class="stub"><div class="lbl">DEX</div><input id="f-dex" type="number" value="${c.dex}"></div>
        <div class="stub"><div class="lbl">INT</div><input id="f-int" type="number" value="${c.int}"></div>
        <div class="stub"><div class="lbl">WIL</div><input id="f-wil" type="number" value="${c.wil}"></div>
      </div>

      <div class="vitals-strip">
        <div class="vital">
          <div class="lbl">Hit Points</div>
          <div class="hp-row">
            <button id="hp-dn">−</button>
            <span class="cur" id="hp-cur">${c.hp.cur}</span>
            <button id="hp-up">+</button>
            <span class="max">/ <input id="f-hpmax" type="number" value="${c.hp.max}"></span>
          </div>
        </div>
        <div class="vital simple-num">
          <div class="lbl">Armor</div>
          <input id="f-armor" type="number" value="${c.armor}">
        </div>
        <div class="vital simple-num">
          <div class="lbl">Initiative</div>
          <input id="f-init" type="number" value="${c.initiative}">
        </div>
      </div>

      <div class="wounds-row">
        <span class="lbl">Wounds</span>
        <div id="woundDots" style="display:flex;gap:6px"></div>
      </div>

      <div class="section-label">Währung</div>
      <div class="currency-grid">
        <div class="currency-item"><span class="cur-lbl">Platin</span><input id="f-plat" type="number" value="${(c.currency||{}).platinum||0}" min="0"></div>
        <div class="currency-item"><span class="cur-lbl">Gold</span><input id="f-gold" type="number" value="${(c.currency||{}).gold||0}" min="0"></div>
        <div class="currency-item"><span class="cur-lbl">Silber</span><input id="f-silv" type="number" value="${(c.currency||{}).silver||0}" min="0"></div>
        <div class="currency-item"><span class="cur-lbl">Bronze</span><input id="f-brnz" type="number" value="${(c.currency||{}).bronze||0}" min="0"></div>
      </div>

      <div class="section-label">Skills</div>
      <div class="skills-grid" id="skillsGrid"></div>

      <div class="section-label">Inventar & Ausrüstung</div>
      <div class="list-block">
        <div id="invList"></div>
        <div class="add-row">
          <input id="invInput" placeholder="Neuer Gegenstand…">
          <button id="invAdd">+ Add</button>
        </div>
      </div>

      <div class="section-label">Fähigkeiten & Talente</div>
      <div class="list-block">
        <div id="abList"></div>
        <div class="add-row">
          <input id="abInput" placeholder="Neue Fähigkeit…">
          <button id="abAdd">+ Add</button>
        </div>
      </div>

      <div class="section-label">Background & Notizen</div>
      <div class="notes-block">
        <textarea id="f-notes" placeholder="Hintergrundgeschichte, Ziele, wichtige NPCs…">${escapeHtml(c.notes||'')}</textarea>
      </div>

      <div class="barcode"></div>
    </div>
  `;

  document.getElementById('backBtn').addEventListener('click', renderRoster);

  // photo upload
  function compressImage(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = (e)=>{
        const img = new Image();
        img.onload = ()=>{
          const maxDim = 9999;
          let w = img.width, h = img.height;
          if(w > h && w > maxDim){ h = h*(maxDim/w); w = maxDim; }
          else if(h > maxDim){ w = w*(maxDim/h); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.95));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // photo gallery
  if(!c.photos) c.photos = c.photo ? [c.photo] : [];

  function openLightbox(startIdx){
    let cur = startIdx;
    let lb = document.getElementById('lightbox');
    if(!lb){ lb = document.createElement('div'); lb.id='lightbox'; lb.className='lightbox'; document.body.appendChild(lb); }
    function draw(){
      const prev = c.photos.length > 1 ? '<button class="lb-prev">&#8249;</button>' : '';
      const next = c.photos.length > 1 ? '<button class="lb-next">&#8250;</button>' : '';
      lb.innerHTML = '<img src="" alt="Foto"><button class="lb-close">&#10005;</button>' + prev + next;
      lb.querySelector('img').src = c.photos[cur];
      lb.querySelector('.lb-close').addEventListener('click', ()=>{ lb.style.display='none'; });
      lb.onclick = (e)=>{ if(e.target===lb) lb.style.display='none'; };
      const p = lb.querySelector('.lb-prev');
      const n = lb.querySelector('.lb-next');
      if(p) p.addEventListener('click', (e)=>{ e.stopPropagation(); cur=(cur-1+c.photos.length)%c.photos.length; draw(); });
      if(n) n.addEventListener('click', (e)=>{ e.stopPropagation(); cur=(cur+1)%c.photos.length; draw(); });
    }
    draw();
    lb.style.display='flex';
  }

  function renderGallery(){
    const strip = document.getElementById('galleryStrip');
    if(!strip) return;
    strip.innerHTML = '';
    c.photos.forEach((photo, idx)=>{
      const thumb = document.createElement('div');
      thumb.className = 'gallery-thumb';
      const img = document.createElement('img');
      img.src = photo;
      img.alt = 'Foto ' + (idx+1);
      img.addEventListener('click', ()=>openLightbox(idx));
      const rem = document.createElement('button');
      rem.className = 'th-remove';
      rem.textContent = '✕';
      rem.setAttribute('aria-label', 'Foto entfernen');
      rem.addEventListener('click', async (e)=>{
        e.stopPropagation();
        c.photos.splice(idx,1);
        renderGallery();
        await saveChar(c);
      });
      thumb.appendChild(img);
      thumb.appendChild(rem);
      strip.appendChild(thumb);
    });
    const addBtn = document.createElement('button');
    addBtn.className = 'gallery-add';
    addBtn.textContent = '+';
    addBtn.setAttribute('aria-label', 'Foto hinzufügen');
    addBtn.addEventListener('click', ()=>document.getElementById('photoInput').click());
    strip.appendChild(addBtn);
  }
  renderGallery();

  document.getElementById('photoInput').addEventListener('change', async (e)=>{
    const files = Array.from(e.target.files);
    if(!files.length) return;
    try{
      for(const file of files){
        const dataUrl = await compressImage(file);
        c.photos.push(dataUrl);
      }
      await saveChar(c);
      renderGallery();
    }catch(err){
      alert('Bild konnte nicht geladen werden.');
    }
    e.target.value = '';
  });

  // simple field bindings
  const bindText = (elId, key)=>{
    document.getElementById(elId).addEventListener('change', async (e)=>{
      c[key] = e.target.value; await saveChar(c);
    });
  };
  const bindNum = (elId, key)=>{
    document.getElementById(elId).addEventListener('change', async (e)=>{
      c[key] = parseInt(e.target.value)||0; await saveChar(c);
    });
  };
  bindText('f-name','name'); bindText('f-anc','ancestry'); bindText('f-cls','cls');
  bindText('f-hd','hitDice'); bindText('f-notes','notes');
  bindNum('f-lvl','level'); bindNum('f-str','str'); bindNum('f-dex','dex');
  bindNum('f-int','int'); bindNum('f-wil','wil'); bindNum('f-armor','armor'); bindNum('f-init','initiative');

  // currency
  if(!c.currency) c.currency = {bronze:0,silver:0,gold:0,platinum:0};
  [['f-plat','platinum'],['f-gold','gold'],['f-silv','silver'],['f-brnz','bronze']].forEach(([fid,key])=>{
    document.getElementById(fid).addEventListener('change', async (e)=>{
      c.currency[key] = parseInt(e.target.value)||0; await saveChar(c);
    });
  });

  // set initial HP color if above max
  if(c.hp.cur > c.hp.max) document.getElementById('hp-cur').style.color = 'var(--brass-bright)';

  document.getElementById('f-hpmax').addEventListener('change', async (e)=>{
    c.hp.max = parseInt(e.target.value)||0;
    if(c.hp.cur > c.hp.max) c.hp.cur = c.hp.max;
    document.getElementById('hp-cur').textContent = c.hp.cur;
    await saveChar(c);
  });
  document.getElementById('hp-up').addEventListener('click', async ()=>{
    c.hp.cur = c.hp.cur + 1;
    const curEl = document.getElementById('hp-cur');
    curEl.textContent = c.hp.cur;
    curEl.style.color = c.hp.cur > c.hp.max ? 'var(--brass-bright)' : 'var(--teal)';
    await saveChar(c);
  });
  document.getElementById('hp-dn').addEventListener('click', async ()=>{
    c.hp.cur = Math.max(0, c.hp.cur-1);
    const curEl = document.getElementById('hp-cur');
    curEl.textContent = c.hp.cur;
    curEl.style.color = c.hp.cur > c.hp.max ? 'var(--brass-bright)' : 'var(--teal)';
    await saveChar(c);
  });

  // wounds
  function renderWounds(){
    const wrap = document.getElementById('woundDots');
    wrap.innerHTML = '';
    for(let i=0;i<c.wounds.max;i++){
      const b = document.createElement('button');
      b.className = 'wound-dot' + (i < c.wounds.cur ? ' filled' : '');
      b.addEventListener('click', async ()=>{
        c.wounds.cur = (i+1 === c.wounds.cur) ? i : i+1;
        renderWounds();
        await saveChar(c);
      });
      wrap.appendChild(b);
    }
  }
  renderWounds();

  // skills
  function renderSkills(){
    const grid = document.getElementById('skillsGrid');
    grid.innerHTML = '';
    c.skills.forEach((s, idx)=>{
      const row = document.createElement('div');
      row.className = 'skill-row';
      row.innerHTML = `
        <div class="skill-left"><span class="sname" title="Tippen zum Bearbeiten">${escapeHtml(s.name)}</span><span class="stag">${s.stat}</span></div>
        <div class="sval-wrap">
          <button data-a="dn">−</button>
          <span class="sval">${s.val}</span>
          <button data-a="up">+</button>
        </div>
      `;
      row.querySelector('.sname').addEventListener('click', ()=>{
        const left = row.querySelector('.skill-left');
        left.innerHTML = '';
        const ni = document.createElement('input');
        ni.value = s.name;
        ni.style.cssText = 'font-size:12px;border:1px solid var(--brass);border-radius:3px;padding:3px 5px;background:#f2ead8;color:var(--ink);width:68px';
        const ti = document.createElement('input');
        ti.value = s.stat;
        ti.style.cssText = 'font-family:IBM Plex Mono,monospace;font-size:9px;border:1px solid var(--brass);border-radius:3px;padding:3px 4px;background:#f2ead8;color:#5c5237;width:34px;margin-left:4px;text-transform:uppercase';
        const sb = document.createElement('button');
        sb.textContent = '✓';
        sb.style.cssText = 'background:var(--brass);border:none;color:#fff;font-size:14px;border-radius:3px;padding:3px 8px;margin-left:4px;cursor:pointer';
        left.appendChild(ni); left.appendChild(ti); left.appendChild(sb);
        ni.focus();
        let done = false;
        const doSave = async ()=>{
          if(done) return; done = true;
          const n = ni.value.trim(); const t = ti.value.trim().toUpperCase();
          if(n) s.name = n; if(t) s.stat = t;
          await saveChar(c); renderSkills();
        };
        sb.addEventListener('click', doSave);
        ni.addEventListener('keydown', e=>{ if(e.key==='Enter') doSave(); if(e.key==='Escape'){ done=true; renderSkills(); } });
        ti.addEventListener('keydown', e=>{ if(e.key==='Enter') doSave(); });
      });
      row.querySelector('[data-a="up"]').addEventListener('click', async ()=>{
        s.val++; row.querySelector('.sval').textContent = s.val; await saveChar(c);
      });
      row.querySelector('[data-a="dn"]').addEventListener('click', async ()=>{
        s.val--; row.querySelector('.sval').textContent = s.val; await saveChar(c);
      });
      grid.appendChild(row);
    });
  }
  renderSkills();

  // inventory list
  function renderInv(){
    const wrap = document.getElementById('invList');
    wrap.innerHTML = '';
    c.inventory.forEach((item, idx)=>{
      const row = document.createElement('div');
      row.className = 'list-item';
      const span = document.createElement('span');
      span.style.flex = '1';
      span.textContent = item;
      const editBtn = document.createElement('button');
      editBtn.className = 'item-edit-btn';
      editBtn.textContent = '✏';
      editBtn.setAttribute('aria-label', 'Bearbeiten');
      const delBtn = document.createElement('button');
      delBtn.className = 'item-del-btn';
      delBtn.textContent = '✕';
      delBtn.setAttribute('aria-label', 'Löschen');
      row.appendChild(span); row.appendChild(editBtn); row.appendChild(delBtn);
      editBtn.addEventListener('click', ()=>{
        const inp = document.createElement('input');
        inp.className = 'item-edit-input';
        inp.value = item;
        const sav = document.createElement('button');
        sav.className = 'item-save-btn';
        sav.textContent = '✓';
        row.innerHTML = '';
        row.appendChild(inp); row.appendChild(sav);
        inp.focus();
        const doSave = async ()=>{
          const v = inp.value.trim();
          if(v) c.inventory[idx] = v;
          await saveChar(c); renderInv();
        };
        sav.addEventListener('click', doSave);
        inp.addEventListener('keydown', e=>{ if(e.key==='Enter') doSave(); if(e.key==='Escape') renderInv(); });
      });
      delBtn.addEventListener('click', async ()=>{
        c.inventory.splice(idx,1); renderInv(); await saveChar(c);
      });
      wrap.appendChild(row);
    });
  }
  renderInv();
  document.getElementById('invAdd').addEventListener('click', async ()=>{
    const inp = document.getElementById('invInput');
    if(!inp.value.trim()) return;
    c.inventory.push(inp.value.trim());
    inp.value = '';
    renderInv();
    await saveChar(c);
  });
  document.getElementById('invInput').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') document.getElementById('invAdd').click();
  });

  // abilities list
  function renderAb(){
    const wrap = document.getElementById('abList');
    wrap.innerHTML = '';
    c.abilities.forEach((item, idx)=>{
      const row = document.createElement('div');
      row.className = 'list-item';
      const span = document.createElement('span');
      span.style.flex = '1';
      span.textContent = item;
      const editBtn = document.createElement('button');
      editBtn.className = 'item-edit-btn';
      editBtn.textContent = '✏';
      editBtn.setAttribute('aria-label', 'Bearbeiten');
      const delBtn = document.createElement('button');
      delBtn.className = 'item-del-btn';
      delBtn.textContent = '✕';
      delBtn.setAttribute('aria-label', 'Löschen');
      row.appendChild(span); row.appendChild(editBtn); row.appendChild(delBtn);
      editBtn.addEventListener('click', ()=>{
        const inp = document.createElement('input');
        inp.className = 'item-edit-input';
        inp.value = item;
        const sav = document.createElement('button');
        sav.className = 'item-save-btn';
        sav.textContent = '✓';
        row.innerHTML = '';
        row.appendChild(inp); row.appendChild(sav);
        inp.focus();
        const doSave = async ()=>{
          const v = inp.value.trim();
          if(v) c.abilities[idx] = v;
          await saveChar(c); renderAb();
        };
        sav.addEventListener('click', doSave);
        inp.addEventListener('keydown', e=>{ if(e.key==='Enter') doSave(); if(e.key==='Escape') renderAb(); });
      });
      delBtn.addEventListener('click', async ()=>{
        c.abilities.splice(idx,1); renderAb(); await saveChar(c);
      });
      wrap.appendChild(row);
    });
  }
  renderAb();
  document.getElementById('abAdd').addEventListener('click', async ()=>{
    const inp = document.getElementById('abInput');
    if(!inp.value.trim()) return;
    c.abilities.push(inp.value.trim());
    inp.value = '';
    renderAb();
    await saveChar(c);
  });
  document.getElementById('abInput').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') document.getElementById('abAdd').click();
  });
}

renderRoster();
</script>
</body>
</html>
